<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Login BD</title>

  <style>
    :root{
      --bg1:#0f172a;
      --bg2:#111827;
      --card:#0b1220cc;
      --border:#ffffff1a;
      --text:#e5e7eb;
      --muted:#9ca3af;
      --primary:#6366f1;
      --primary2:#8b5cf6;
      --danger:#ef4444;
      --ok:#22c55e;
      --shadow: 0 20px 60px rgba(0,0,0,.45);
      --radius: 16px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      min-height:100vh;
      font-family: var(--sans);
      color: var(--text);
      display:grid;
      place-items:center;
      padding:24px;
      background:
        radial-gradient(900px 600px at 10% 10%, rgba(99,102,241,.35), transparent 60%),
        radial-gradient(900px 600px at 90% 20%, rgba(139,92,246,.25), transparent 60%),
        radial-gradient(900px 600px at 50% 95%, rgba(34,197,94,.12), transparent 60%),
        linear-gradient(160deg, var(--bg1), var(--bg2));
    }

    .wrap{ width: min(420px, 100%); }

    .card{
      background: var(--card);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      padding: 22px;
    }

    .brand{
      display:flex;
      gap:12px;
      align-items:center;
      margin-bottom: 14px;
    }
    .logo{
      width:44px;
      height:44px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      box-shadow: 0 10px 30px rgba(99,102,241,.25);
    }
    h2{
      margin:0;
      font-size: 20px;
      letter-spacing: .2px;
    }
    .subtitle{
      margin: 6px 0 16px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    label{
      display:block;
      font-size: 12px;
      color: var(--muted);
      margin: 12px 0 6px;
    }

    .field{
      width:100%;
      display:flex;
      gap:10px;
      align-items:center;
      padding: 12px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.04);
      transition: border-color .15s ease, background .15s ease;
    }
    .field:focus-within{
      border-color: rgba(99,102,241,.6);
      background: rgba(255,255,255,.06);
    }
    .field input{
      width:100%;
      border:none;
      outline:none;
      background: transparent;
      color: var(--text);
      font-size: 14px;
    }

    .row{
      display:flex;
      gap:10px;
      margin-top: 14px;
    }

    button{
      flex:1;
      border:none;
      cursor:pointer;
      padding: 12px 14px;
      border-radius: 12px;
      font-weight: 600;
      color: white;
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      box-shadow: 0 12px 30px rgba(99,102,241,.25);
      transition: transform .06s ease, filter .15s ease;
    }
    button:hover{ filter: brightness(1.05); }
    button:active{ transform: translateY(1px); }
    button:disabled{
      opacity:.6;
      cursor:not-allowed;
      box-shadow:none;
    }

    .mini{
      flex:0 0 auto;
      background: rgba(255,255,255,.06);
      border: 1px solid var(--border);
      color: var(--text);
      box-shadow:none;
    }

    .out{
      margin-top: 14px;
      padding: 12px;
      border-radius: 12px;
      border: 1px dashed var(--border);
      background: rgba(0,0,0,.22);
      font-family: var(--mono);
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 240px;
      overflow:auto;
    }

    .status{
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
    }
    .status.ok{ color: rgba(34,197,94,.95); }
    .status.bad{ color: rgba(239,68,68,.95); }

    @media (prefers-reduced-motion: reduce){
      *{ transition:none !important; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <div>
          <h2>Login (usuario de BD)</h2>
          <div class="subtitle">Ingresa tus credenciales para obtener el token y entrar al sistema.</div>
        </div>
      </div>

      <label for="username">Usuario</label>
      <div class="field">
        <input id="username" autocomplete="username" placeholder="usu_admin | usu_vendedor | usu_analista">
      </div>

      <label for="password">Contraseña</label>
      <div class="field">
        <input id="password" type="password" autocomplete="current-password" placeholder="password">
      </div>

      <div class="row">
        <button id="btnLogin" onclick="login()">Entrar</button>
        <button class="mini" type="button" onclick="togglePass()">Ver</button>
      </div>

      <div id="status" class="status"></div>
      <pre id="out" class="out">{}</pre>
    </div>
  </div>

  <script>
    function togglePass(){
      const input = document.getElementById('password');
      input.type = (input.type === 'password') ? 'text' : 'password';
    }

    async function login(){
      const btn = document.getElementById('btnLogin');
      const status = document.getElementById('status');
      const out = document.getElementById('out');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      status.className = 'status';
      status.textContent = '';
      out.textContent = '';

      if(!username || !password){
        status.classList.add('bad');
        status.textContent = 'Completa usuario y contraseña.';
        out.textContent = JSON.stringify({ exito:false, mensaje:'Campos vacíos' }, null, 2);
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Entrando...';

      try{
        const res = await fetch('http://localhost:4000/api/auth/login', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ username, password })
        });

        const data = await res.json().catch(() => ({ exito:false, mensaje:'Respuesta no es JSON' }));
        out.textContent = JSON.stringify(data, null, 2);

        if(res.ok && data.exito){
          status.classList.add('ok');
          status.textContent = 'Login correcto. Redirigiendo...';

          localStorage.setItem('token', data.token);
          localStorage.setItem('role', data.role);
          localStorage.setItem('username', username);

          setTimeout(() => { location.href = 'index.html'; }, 450);
        }else{
          status.classList.add('bad');
          status.textContent = data?.mensaje || ('Login falló (HTTP ' + res.status + ')');
        }
      }catch(err){
        status.classList.add('bad');
        status.textContent = 'No se pudo conectar a la API.';
        out.textContent = JSON.stringify({ exito:false, error: String(err) }, null, 2);
      }finally{
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    }

    document.addEventListener('keydown', (e) => {
      if(e.key === 'Enter') login();
    });
  </script>
</body>
</html>
